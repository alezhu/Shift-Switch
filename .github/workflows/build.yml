name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLUTION: ShiftSwitch.sln

jobs:
  build:
    name: Build ${{ matrix.config }} ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        platform: [x86, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup VS 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.platform == 'x64' && 'x64' || 'x86' }}

      - name: Build
        run: >
          msbuild ${{ env.SOLUTION }}
          /p:Configuration=${{ matrix.config }}
          /p:Platform=${{ matrix.platform }}
          /p:PlatformToolset=v143
          /p:PublishRepositoryUrl=true
          /p:EmbedUntrackedSources=true
          /p:IncludeSymbols=true
          /p:SymbolPackageFormat=snupkg
          /verbosity:minimal

      - name: Run unit tests
        run: .\${{ matrix.platform == 'x64' && 'x64' || 'Win32' }}\${{ matrix.config }}\ShiftSwitchTests.exe

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config }}-${{ matrix.platform }}
          path: |
            bin/${{ matrix.config }}/*.exe
            bin/${{ matrix.config }}/*.dll
            bin/${{ matrix.config }}/*.pdb
            bin/${{ matrix.config }}/*.snupkg
            ${{ matrix.config }}/*.exe
            ${{ matrix.config }}/*.dll
            ${{ matrix.config }}/*.pdb
            ${{ matrix.config }}/*.snupkg
          retention-days: 7

  analyze:
    name: Static Analysis
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup VS 2022 (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Run Static Analysis
        run: >
          msbuild ${{ env.SOLUTION }}
          /p:Configuration=Release
          /p:Platform=x64
          /p:PlatformToolset=v143
          /p:RunCodeAnalysis=true
          /verbosity:minimal

  package:
    name: Package Installer
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download x64 release binaries
        uses: actions/download-artifact@v4
        with:
          name: Release-x64
          path: artifacts/x64

      - name: Download x86 release binaries
        uses: actions/download-artifact@v4
        with:
          name: Release-x86
          path: artifacts/x86

      - name: Collect installer input
        run: |
          New-Item -ItemType Directory -Force -Path bin/Release | Out-Null
          New-Item -ItemType Directory -Force -Path Release | Out-Null
          Copy-Item artifacts/x64/*.exe,artifacts/x64/*.dll bin/Release/ -ErrorAction SilentlyContinue
          Copy-Item artifacts/x86/*.exe,artifacts/x86/*.dll bin/Release/ -ErrorAction SilentlyContinue
          Copy-Item artifacts/x64/*.exe,artifacts/x64/*.dll Release/ -ErrorAction SilentlyContinue
          Copy-Item artifacts/x86/*.exe,artifacts/x86/*.dll Release/ -ErrorAction SilentlyContinue
          Get-ChildItem bin/Release

      - name: Install NSIS
        run: choco install nsis -y --no-progress
        shell: cmd

      - name: Build NSIS installer
        run: makensis installer/installer.nsi
        shell: cmd

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/Shift-Switch-Installer_*.exe
          retention-days: 30

      - name: Upload release symbols
        uses: actions/upload-artifact@v4
        with:
          name: symbols-release
          path: |
            artifacts/x64/*.pdb
            artifacts/x86/*.pdb
          retention-days: 90
