name: Build

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLUTION: ShiftSwitch.sln

jobs:
  build:
    name: Build ${{ matrix.config }} ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        platform: [x86, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup VS 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.platform == 'x64' && 'x64' || 'x86' }}

      - name: Build
        run: >
          msbuild ${{ env.SOLUTION }}
          /p:Configuration=${{ matrix.config }}
          /p:Platform=${{ matrix.platform }}
          /p:PlatformToolset=v143
          /p:PublishRepositoryUrl=true
          /p:EmbedUntrackedSources=true
          /p:IncludeSymbols=true
          /p:SymbolPackageFormat=snupkg
          /verbosity:minimal

      - name: Run unit tests
        run: .\bin\tests\${{ matrix.platform }}\${{ matrix.config }}\ShiftSwitchTests.exe

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config }}-${{ matrix.platform }}
          path: |
            bin/${{ matrix.config }}/*.exe
            bin/${{ matrix.config }}/*.dll
            bin/${{ matrix.config }}/*.pdb
            bin/${{ matrix.config }}/*.snupkg
            ${{ matrix.config }}/*.exe
            ${{ matrix.config }}/*.dll
            ${{ matrix.config }}/*.pdb
            ${{ matrix.config }}/*.snupkg
          retention-days: 7

  analyze:
    name: Static Analysis
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup VS 2022 (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Run Static Analysis
        run: >
          msbuild ${{ env.SOLUTION }}
          /p:Configuration=Release
          /p:Platform=x64
          /p:PlatformToolset=v143
          /p:RunCodeAnalysis=true
          /verbosity:minimal

  package:
    name: Package and Release Installer
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate version tag
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Error "Tag '$tag' does not match version format vX.Y.Z"
            exit 1
          }

      - name: Extract changelog notes
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $content = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^##\s*\[v?$([regex]::Escape($version))\].*?\r?\n(.*?)(?=^##\s*\[|\z)"
          if ($content -match $pattern) {
            $notes = $matches[1].Trim()
          } else {
            $notes = "Release $tag"
          }
          $notes | Out-File -FilePath release_notes.md -Encoding utf8
          Get-Content release_notes.md

      - name: Download x64 release binaries
        uses: actions/download-artifact@v8
        with:
          name: Release-x64
          path: artifacts/x64

      - name: Download x86 release binaries
        uses: actions/download-artifact@v8
        with:
          name: Release-x86
          path: artifacts/x86

      - name: Collect installer input
        run: |
          New-Item -ItemType Directory -Force -Path bin/Release | Out-Null
          New-Item -ItemType Directory -Force -Path Release | Out-Null
          Get-ChildItem -Path artifacts -Recurse -Include *.exe, *.dll | Copy-Item -Destination bin/Release/ -Force
          Copy-Item bin/Release/* Release/ -Force
          Get-ChildItem bin/Release

      - name: Install NSIS and plugins
        run: |
          choco install nsis -y --no-progress
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (Test-Path $nsisDir) {
            $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/systempal/nsis-plugin-nsprocess/main/include/nsProcess.nsh" -OutFile "$nsisDir\Include\nsProcess.nsh"
            New-Item -ItemType Directory -Force -Path "$nsisDir\Plugins\x86-unicode", "$nsisDir\Plugins\x86-ansi" | Out-Null
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/systempal/nsis-plugin-nsprocess/main/dist/x86-unicode/nsProcess.dll" -OutFile "$nsisDir\Plugins\x86-unicode\nsProcess.dll"
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/systempal/nsis-plugin-nsprocess/main/dist/x86-ansi/nsProcess.dll" -OutFile "$nsisDir\Plugins\x86-ansi\nsProcess.dll"
          }

      - name: Build NSIS installer
        run: |
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            makensis installer/installer.nsi
          } elseif (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
            & "C:\Program Files (x86)\NSIS\makensis.exe" installer/installer.nsi
          } else {
            throw "makensis executable not found"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: installer/Shift-Switch-Installer_*.exe
          retention-days: 30

      - name: Upload release symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols-release
          path: |
            artifacts/**/*.pdb
          retention-days: 90

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $installer = (Get-Item installer/Shift-Switch-Installer_*.exe).FullName
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer --clobber
            gh release edit $tag --title "ShiftSwitch $tag" --notes-file release_notes.md
          } else {
            gh release create $tag $installer --title "ShiftSwitch $tag" --notes-file release_notes.md
          }
